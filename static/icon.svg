<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradien Logam/Chrome untuk Aksen -->
    <linearGradient id="chromeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Gradien Neon Cyan (Khas Dashboard Mobil Sport) -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <!-- Gradien Latar Belakang Carbon -->
    <radialGradient id="carbonBg" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Path untuk Teks Melengkung -->
    <path id="textPathArc" d="M 100 250 A 150 150 0 0 1 400 250" fill="none" />
  </defs>

  <!-- Latar Belakang Kanvas -->
  <rect width="100%" height="100%" fill="#020617" />

  <!-- Bingkai Luar (Outer Ring) -->
  <circle cx="250" cy="250" r="220" fill="url(#carbonBg)" stroke="#1E293B" stroke-width="8" />
  
  <!-- Garis Tachometer (Speedometer Ticks) - Nuansa Otomotif -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="url(#neonCyan)" stroke-width="6" stroke-dasharray="2 12" opacity="0.6"/>
  
  <!-- Garis Kecepatan / Aerodinamis (Speed Lines) -->
  <path d="M 60 300 Q 200 380 440 280" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M 70 320 Q 200 390 430 300" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-linecap="round" opacity="0.2"/>

  <!-- Elemen Tengah: Simbol "V" Bergaya Piston/Injeksi Racing -->
  <g id="v-logo">
    <!-- Bayangan Glow di Bawah V -->
    <path d="M 160 200 L 250 360 L 340 200 L 300 200 L 250 290 L 200 200 Z" fill="#00F2FE" opacity="0.15" filter="blur(8px)"/>
    
    <!-- Bentuk V Utama (Metallic) -->
    <path d="M 160 190 L 250 350 L 340 190 L 300 190 L 250 280 L 200 190 Z" fill="url(#chromeGradient)" />
    
    <!-- Garis Aksen Neon di Dalam V -->
    <path d="M 185 190 L 250 315 L 315 190" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Detail Tech: Titik Injeksi / Nosel di Atas V -->
    <rect x="240" y="165" width="20" height="10" rx="3" fill="url(#chromeGradient)" />
    <line x1="250" y1="175" x2="250" y2="190" stroke="url(#neonCyan)" stroke-width="3" />
    <circle cx="250" cy="160" r="4" fill="#00F2FE" />
  </g>

  <!-- Teks Atas: "VEHICLES GUARD" (Mengikuti Lengkungan) -->
  <text font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="18" fill="#64748B" letter-spacing="4">
    <textPath href="#textPathArc" startOffset="50%" text-anchor="middle">VEHICLES GUARD</textPath>
  </text>

  <!-- Teks Bawah: "V-GUARD" -->
  <text x="250" y="420" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    V-GUARD
  </text>

  <!-- Garis Aksen Bawah (Seperti Bumper Mobil) -->
  <path d="M 180 440 L 320 440" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" />
  <path d="M 210 455 L 290 455" stroke="#334155" stroke-width="3" stroke-linecap="round" />
</svg>