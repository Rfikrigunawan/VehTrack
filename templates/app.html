<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#020617" />
<title>Vehicle Tracker — Dashboard</title>

<link rel="icon" href="{{ url_for('static', filename='icon.svg') }}">

<!-- Bootstrap 5.3 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome 6 (Solid + Regular + Brands) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Flatpickr -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- App styles -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/app/index.css') }}">
</head>
<body>

<!-- ==================== Background Decor ==================== -->
<div class="bg-decor" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-road"></div>
  <div class="bg-speedometer"></div>
  <div class="bg-beam"></div>
</div>

<div id="sidebar-overlay" class="sidebar-overlay"></div>

<div class="app-shell">

  <!-- ==================== SIDEBAR ==================== -->
  <aside id="sidebar" class="app-sidebar">

    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo">
        <i class="fa-solid fa-car-side"></i>
        <span class="sidebar-brand-logo-glow"></span>
      </div>
      <div class="sidebar-brand-text">
        <div class="sidebar-brand-name">
          Vehicle<span class="sidebar-brand-name-accent">Tracker</span>
        </div>
        <div class="sidebar-brand-tag">
          <span class="sidebar-brand-dot"></span>
          Smart tracking system
        </div>
      </div>
    </div>

    <!-- Nav -->
    <nav class="sidebar-nav">
      <div class="sidebar-section">MENU</div>

      <a data-nav="dashboard" class="sidebar-item">
        <span class="sidebar-item-icon"><i class="fa-solid fa-table-cells-large"></i></span>
        <span class="sidebar-item-text">Dashboard</span>
      </a>

      <a data-nav="vehicles" class="sidebar-item">
        <span class="sidebar-item-icon"><i class="fa-solid fa-car-side"></i></span>
        <span class="sidebar-item-text">Kendaraan</span>
      </a>

      <a data-nav="service_records" class="sidebar-item">
        <span class="sidebar-item-icon"><i class="fa-solid fa-screwdriver-wrench"></i></span>
        <span class="sidebar-item-text">Servis</span>
      </a>

      <a data-nav="fuel_logs" class="sidebar-item">
        <span class="sidebar-item-icon"><i class="fa-solid fa-gas-pump"></i></span>
        <span class="sidebar-item-text">BBM</span>
      </a>

      <a data-nav="documents" class="sidebar-item">
        <span class="sidebar-item-icon"><i class="fa-solid fa-file-lines"></i></span>
        <span class="sidebar-item-text">Dokumen</span>
      </a>

      <a data-nav="reminders" class="sidebar-item">
        <span class="sidebar-item-icon"><i class="fa-solid fa-bell"></i></span>
        <span class="sidebar-item-text">Pengingat</span>
      </a>

        <!-- ⬇️ BARU ⬇️ -->
      <a data-nav="reports" class="sidebar-item">
        <span class="sidebar-item-icon"><i class="fa-solid fa-chart-line"></i></span>
        <span class="sidebar-item-text">Laporan</span>
      </a>

      <div class="sidebar-section">AKUN</div>

      <a data-nav="settings" class="sidebar-item">
        <span class="sidebar-item-icon"><i class="fa-solid fa-gear"></i></span>
        <span class="sidebar-item-text">Pengaturan</span>
      </a>
    </nav>

    <!-- User Footer -->
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">{{ (user.name or user.email)[0] | upper }}</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">{{ user.name or 'User' }}</div>
          <div class="sidebar-user-email">{{ user.email }}</div>
        </div>
        <button id="btn-logout" class="sidebar-user-action" title="Logout" aria-label="Logout">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- ==================== MAIN ==================== -->
  <main class="app-main">

    <!-- Header -->
    <header class="app-header">
      <div class="app-header-left">
        <button id="btn-hamburger" class="btn-icon-round d-lg-none" aria-label="Buka menu">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="app-header-titles">
          <h1 id="page-title" class="app-header-title">Dashboard</h1>
          <div class="app-header-subtitle" id="page-subtitle">Ringkasan kendaraan Anda</div>
        </div>
      </div>

      <div class="app-header-right">
        <div class="header-filter">
          <i class="fa-solid fa-filter header-filter-icon"></i>
          <select id="vehicle-select" class="header-filter-select" aria-label="Filter kendaraan">
            <option value="">Semua Kendaraan</option>
          </select>
        </div>

        <!-- Theme toggle -->
        <button id="btn-theme" class="btn-icon-round" type="button"
                title="Ganti tema" aria-label="Ganti tema">
          <i class="fa-solid fa-moon"></i>
        </button>

        <button id="btn-refresh" class="btn-icon-round" title="Refresh" aria-label="Refresh">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </header>

    <!-- Content -->
    <section id="content" class="app-content"></section>
  </main>
</div>

<!-- ==================== MODAL ==================== -->
<div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Modal</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
      </div>
      <form id="modal-form" autocomplete="off">
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
          <button id="modal-submit" type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ==================== TOAST ==================== -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container">
  <div id="toast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toast-body"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Tutup"></button>
    </div>
  </div>
</div>

<!-- ==================== SCRIPTS ==================== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13" defer></script>

<!-- ============ App Modules (order matters!) ============ -->

<!-- 1. Utils -->
<script src="{{ url_for('static', filename='js/app/utils/icons.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/utils/dom.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/utils/timezone.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/utils/formatters.js') }}" defer></script>

<!-- 2. Core -->
<script src="{{ url_for('static', filename='js/app/core/state.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/core/api.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/core/router.js') }}" defer></script>

<!-- 3. Shared -->
<script src="{{ url_for('static', filename='js/app/shared/files.js') }}" defer></script>

<!-- 4. Layout -->
<script src="{{ url_for('static', filename='js/app/layout/theme.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/layout/sidebar.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/layout/header.js') }}" defer></script>

<!-- 5. Views -->
<script src="{{ url_for('static', filename='js/app/views/dashboard.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/views/vehicles.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/views/services.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/views/fuels.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/views/documents.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/views/reminders.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/views/settings.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/views/reports.js') }}" defer></script>  <!-- ⬅️ BARU -->


<!-- 6. Form -->
<script src="{{ url_for('static', filename='js/app/form/builders.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/form/hooks.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/form/definitions.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/form/modal.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/form/page.js') }}" defer></script>

<!-- 7. Renderer + Main -->
<script src="{{ url_for('static', filename='js/app/shared/renderer.js') }}" defer></script>
<script src="{{ url_for('static', filename='js/app/main.js') }}" defer></script>

</body>
</html>
