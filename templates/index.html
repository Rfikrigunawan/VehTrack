<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#020617" />
<meta name="description" content="Vehicle Tracker — Masuk untuk mengelola kendaraan Anda." />
<title>Masuk — Vehicle Tracker</title>

<link rel="icon" href="{{ url_for('static', filename='icon.svg') }}">

<!-- Bootstrap 5.3 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='index.style.css') }}">
</head>
<body class="landing-body">

<!-- ==================== Background ==================== -->
<div class="bg-decor" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-road"></div>
  <div class="bg-speedometer"></div>
  <div class="bg-beam"></div>
</div>

<!-- ==================== Navbar ==================== -->
<nav class="landing-nav">
  <div class="container-xl">
    <div class="navbar-glass d-flex align-items-center justify-content-between">

      <a class="brand-link d-flex align-items-center gap-2 text-decoration-none" href="/" aria-label="Vehicle Tracker">
        <div class="brand-logo" aria-hidden="true">
          <i class="fa-solid fa-car-side"></i>
        </div>
        <div class="brand-text">
          <div class="brand-name">
            Vehicle<span class="brand-name-accent">Tracker</span>
          </div>
          <div class="brand-sub">
            <span class="brand-sub-dot"></span>
            Smart tracking system
          </div>
        </div>
      </a>

      <div class="d-flex align-items-center gap-2">
        <span class="badge-glass d-none d-sm-inline-flex">
          <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
          <span class="d-none d-md-inline">Powered by PocketBase</span>
          <span class="d-md-none">Secure</span>
        </span>

        <span class="badge-version d-none d-lg-inline-flex">
          v1.0
        </span>

        <button type="button" id="btn-theme" class="btn-theme" title="Ganti tema" aria-label="Ganti tema">
          <i class="fa-solid fa-moon" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- ==================== Main ==================== -->
<main class="landing-main">
  <div class="auth-card-wrapper">
    <div class="auth-card">

      <!-- ============ HERO (Icon + Heading) ============ -->
      <div class="auth-hero">
        <h1 class="auth-hero-title">Login</h1>
        <p class="auth-hero-subtitle">
          Akses akun untuk melanjutkan
        </p>
      </div>

      <!-- ============ Login Form ============ -->
      <form id="form-login" class="auth-form" autocomplete="on" novalidate>
        <div class="form-field">
          <label class="form-label-glass" for="login-email">Email</label>
          <div class="input-glass-wrap">
            <i class="fa-solid fa-envelope input-icon" aria-hidden="true"></i>
            <input type="email" name="identity" id="login-email"
                   required autocomplete="email" inputmode="email"
                   class="input-glass" placeholder="nama@email.com" />
          </div>
        </div>

        <div class="form-field">
          <label class="form-label-glass" for="login-password">Password</label>
          <div class="input-glass-wrap">
            <i class="fa-solid fa-lock input-icon" aria-hidden="true"></i>
            <input type="password" name="password" id="login-password"
                   required autocomplete="current-password"
                   class="input-glass" placeholder="••••••••" />
            <button type="button" class="btn-eye"
                    aria-label="Tampilkan/sembunyikan password">
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-glass-primary">
          <span>Masuk</span>
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </button>
      </form>

      <!-- ============ Divider ============ -->
      <div class="auth-divider-simple">
        <span>belum punya akun?</span>
      </div>

      <!-- ============ Register via Telegram ============ -->
      {% if bot_username %}
      <a href="https://t.me/{{ bot_username }}?start=register"
         target="_blank" rel="noopener"
         class="btn-telegram">
        <i class="fa-brands fa-telegram" aria-hidden="true"></i>
        <span>Daftar via Telegram</span>
        <span class="btn-telegram-badge">30 detik</span>
      </a>
      {% else %}
      <div class="btn-telegram btn-telegram-disabled">
        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
        <span>Bot belum tersedia</span>
      </div>
      {% endif %}

      <!-- ============ Error Alert ============ -->
      <div id="auth-error" class="alert-glass-danger d-none" role="alert" aria-live="polite"></div>

    </div>
  </div>
</main>

<!-- ==================== Footer ==================== -->
<footer class="landing-footer">
  <div class="container-xl">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
      <span class="text-secondary small">© 2026 Vehicle Tracker. All rights reserved.</span>
      <span class="text-secondary small d-flex align-items-center gap-1">
        <i class="fa-solid fa-database" aria-hidden="true"></i>
        Data tersimpan aman di PocketBase
      </span>
    </div>
  </div>
</footer>

<!-- ==================== Script ==================== -->
<script>
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);

  const formLogin = $('#form-login');
  const errBox = $('#auth-error');

  // Theme toggle
  const btnTheme = $('#btn-theme');
  if (btnTheme) {
    const applyTheme = (theme) => {
      document.documentElement.setAttribute('data-bs-theme', theme);
      localStorage.setItem('vt-theme', theme);
      const icon = btnTheme.querySelector('i');
      if (icon) {
        icon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
      }
    };

    const savedTheme = localStorage.getItem('vt-theme');
    if (savedTheme) {
      applyTheme(savedTheme);
    } else {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(prefersDark ? 'dark' : 'light');
    }

    btnTheme.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-bs-theme') || 'dark';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });
  }

  // Password visibility
  document.querySelectorAll('.btn-eye').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const wrap = btn.closest('.input-glass-wrap');
      const input = wrap.querySelector('input');
      const icon = btn.querySelector('i');
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      icon.className = showing ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
      input.focus();
    });
  });

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.remove('d-none');
  }

  function hideError() {
    errBox.classList.add('d-none');
  }

  function setLoading(btn, label) {
    btn.disabled = true;
    btn.dataset.originalHtml = btn.innerHTML;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>${label}`;
  }

  function clearLoading(btn) {
    btn.disabled = false;
    if (btn.dataset.originalHtml) {
      btn.innerHTML = btn.dataset.originalHtml;
      delete btn.dataset.originalHtml;
    }
  }

  async function postJSON(url, body, { retries = 2 } = {}) {
    let lastErr = null;
    for (let i = 0; i <= retries; i++) {
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (res.status >= 400 && res.status < 500) {
            throw new Error(data.error || `HTTP ${res.status}`);
          }
          throw Object.assign(new Error(data.error || `HTTP ${res.status}`), {
            retryable: true,
          });
        }
        return data;
      } catch (err) {
        lastErr = err;
        const isRetryable =
          err.retryable ||
          err.name === 'TypeError' ||
          /network|fetch|timeout/i.test(err.message);
        if (!isRetryable || i === retries) throw err;
        await new Promise((r) => setTimeout(r, 800 * (i + 1)));
      }
    }
    throw lastErr;
  }

  function goToApp() {
    window.location.href = '/app';
  }

  formLogin.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const identity = formLogin.querySelector('input[name="identity"]').value.trim();
    const password = formLogin.querySelector('input[name="password"]').value;

    if (!identity || !password) {
      return showError('Email dan password wajib diisi');
    }

    const btn = formLogin.querySelector('button[type="submit"]');
    setLoading(btn, 'Memproses...');

    try {
      await postJSON('/api/auth/login', { identity, password });
      goToApp();
    } catch (err) {
      showError(err.message || 'Gagal masuk. Coba lagi.');
      clearLoading(btn);
    }
  });

  window.addEventListener('load', () => {
    if (window.innerWidth >= 992) {
      const email = document.getElementById('login-email');
      if (email) email.focus();
    }
  });

})();
</script>

</body>
</html>
